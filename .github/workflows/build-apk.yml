name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: gradle assembleDebug --stacktrace
      - name: Generate third-party dependency license report
        run: gradle :app:generateLicenseReport --stacktrace
      - name: Upload dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: LeadFlow-third-party-license-report
          path: app/build/reports/dependency-license/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LeadFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
