<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">LeadFlow project banner</title><desc id="desc">Animated 3D-inspired project banner for LeadFlow.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080f1c"/><stop offset="1" stop-color="#15283a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
<style>.float{transform-origin:900px 245px;animation:float 5s ease-in-out infinite}.glow{animation:pulse 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0px) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.26}}text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1200" height="480" rx="28" fill="url(#bg)"/><circle class="glow" cx="1020" cy="75" r="220" fill="#60a5fa" opacity=".16"/><circle class="glow" cx="1120" cy="450" r="180" fill="#a78bfa" opacity=".14"/><path d="M0 410 L420 480 L0 480 Z" fill="#60a5fa" opacity=".05"/><rect x="52" y="50" width="8" height="380" rx="4" fill="url(#accent)"/>
<text x="88" y="105" fill="#60a5fa" font-size="18" font-weight="700" letter-spacing="4">ANDROID · UNDER TESTING</text><text x="88" y="185" fill="#f8fafc" font-size="54" font-weight="700">LeadFlow</text><text x="90" y="230" fill="#b9c8d8" font-size="22">Keep every follow-up organized.</text><text x="90" y="300" fill="#71869b" font-size="15" letter-spacing="2">BUILT FOR REAL-WORLD WORKFLOWS</text><rect x="88" y="330" width="190" height="4" rx="2" fill="url(#accent)"/><text x="88" y="385" fill="#93a7bb" font-size="15">BERNARD VIVIAN  /  PROJECT PORTFOLIO</text><ellipse cx="900" cy="415" rx="205" ry="24" fill="#000" opacity=".35" filter="url(#shadow)"/><g><g class="float"><path d="M735 145 L925 80 L1080 145 L890 215 Z" fill="#1a3150" stroke="#60a5fa"/><path d="M735 145 L890 215 L890 415 L735 345 Z" fill="#12233a"/><path d="M890 215 L1080 145 L1080 345 L890 415 Z" fill="#101e32"/><g transform="translate(800 150) skewY(-18)"><rect width="220" height="210" rx="13" fill="#111f32" stroke="#5676a1" stroke-width="2"/><text x="18" y="30" fill="#eff6ff" font-size="17" font-weight="700">Lead pipeline</text><rect x="14" y="48" width="192" height="37" rx="8" fill="#1d3552"/><circle cx="31" cy="66" r="6" fill="#60a5fa"/><text x="45" y="70" fill="#dbeafe" font-size="13">New enquiry</text><rect x="14" y="96" width="192" height="37" rx="8" fill="#1d3552"/><circle cx="31" cy="114" r="6" fill="#a78bfa"/><text x="45" y="118" fill="#dbeafe" font-size="13">Follow-up</text><rect x="14" y="144" width="192" height="37" rx="8" fill="#1d3552"/><circle cx="31" cy="162" r="6" fill="#34d399"/><text x="45" y="166" fill="#dbeafe" font-size="13">Documents sent</text></g></g></g>
</svg>