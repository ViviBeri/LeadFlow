<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d">
<title id="t">LeadFlow Android discovery workflow</title>
<desc id="d">An animated process diagram showing location and category selection, OpenStreetMap lookup, result review, local lead saving, and manual follow-up or export.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#172b48"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.dash{stroke-dasharray:12 10;animation:move 12s linear infinite}.card{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}.card:nth-of-type(2){animation-delay:.6s}.card:nth-of-type(3){animation-delay:1.2s}.card:nth-of-type(4){animation-delay:1.8s}.card:nth-of-type(5){animation-delay:2.4s}@keyframes move{to{stroke-dashoffset:-220}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.dash,.card{animation:none}}</style>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/>
<text x="58" y="62" fill="#f3f8ff" font-size="27" font-weight="750" letter-spacing="2">LEAD DISCOVERY FLOW</text>
<text x="58" y="92" fill="#9fb6d3" font-size="16">Android · OpenStreetMap lookup · local lead management</text>
<path d="M150 220H1250" stroke="#35516f" stroke-width="6" stroke-linecap="round"/><path class="dash" d="M150 220H1250" stroke="url(#a)" stroke-width="3" fill="none" filter="url(#g)"/>
<g class="card" transform="translate(150 220)"><circle r="42" fill="#0e2c45" stroke="#38bdf8" stroke-width="2"/><path d="M-17-12H17V12H-17ZM-9-21V-12M9-21V-12M-8-3H8M-8 5H4" stroke="#d5f5ff" fill="none" stroke-width="3" stroke-linecap="round"/><text x="0" y="74" text-anchor="middle" fill="#f0f8ff" font-size="17" font-weight="700">SEARCH</text><text x="0" y="98" text-anchor="middle" fill="#9fb6d3" font-size="13">Location + category</text></g>
<g class="card" transform="translate(425 220)"><circle r="42" fill="#102f48" stroke="#60a5fa" stroke-width="2"/><path d="M0-22C-14-22-22-11-22 1C-22 16 0 28 0 28S22 16 22 1C22-11 14-22 0-22ZM0-7A8 8 0 1 0 0 9A8 8 0 1 0 0-7" fill="none" stroke="#dcecff" stroke-width="3"/><text x="0" y="74" text-anchor="middle" fill="#f0f8ff" font-size="17" font-weight="700">DISCOVER</text><text x="0" y="98" text-anchor="middle" fill="#9fb6d3" font-size="13">Nominatim + Overpass</text></g>
<g class="card" transform="translate(700 220)"><circle r="42" fill="#1d2d50" stroke="#818cf8" stroke-width="2"/><path d="M-18-15H18V16H-18ZM-10-6H10M-10 2H6M-10 10H2" fill="none" stroke="#e1e3ff" stroke-width="3" stroke-linecap="round"/><text x="0" y="74" text-anchor="middle" fill="#f0f8ff" font-size="17" font-weight="700">REVIEW</text><text x="0" y="98" text-anchor="middle" fill="#9fb6d3" font-size="13">Filter + sort results</text></g>
<g class="card" transform="translate(975 220)"><circle r="42" fill="#2a214c" stroke="#c084fc" stroke-width="2"/><path d="M-16-18H8L18-8V18H-16ZM8-18V-8H18M-8 1H10M-8 9H10" fill="none" stroke="#f0e4ff" stroke-width="3" stroke-linejoin="round"/><text x="0" y="74" text-anchor="middle" fill="#f0f8ff" font-size="17" font-weight="700">SAVE</text><text x="0" y="98" text-anchor="middle" fill="#9fb6d3" font-size="13">Room local database</text></g>
<g class="card" transform="translate(1250 220)"><circle r="42" fill="#123a3b" stroke="#34d399" stroke-width="2"/><path d="M-18-10H18V15H-18ZM-8-18H8M-8-2H8M-8 6H4" fill="none" stroke="#d5ffed" stroke-width="3" stroke-linecap="round"/><text x="0" y="74" text-anchor="middle" fill="#f0f8ff" font-size="17" font-weight="700">FOLLOW UP</text><text x="0" y="98" text-anchor="middle" fill="#9fb6d3" font-size="13">Manual contact + export</text></g>
<text x="58" y="386" fill="#7f9bbd" font-size="13">DATA SOURCE LIMIT: CURRENT DISCOVERY USES OPENSTREETMAP; GOOGLE RATINGS AND REVIEWS ARE NOT PROVIDED.</text>
</svg>